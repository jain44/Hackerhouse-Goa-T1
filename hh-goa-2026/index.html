<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HH Goa 2026 — Frame Your Builder Identity</title>
    <meta name="description" content="Turn your photo into your official HH Goa 2026 builder identity card. No login, instant generation, shareable." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="hh-splash" aria-label="Loading Hack House Goa">
      <div class="hh-splash-grid"></div>
      <div class="hh-splash-sun"></div>
      <div class="hh-splash-palm hh-splash-palm-left">🌴</div>
      <div class="hh-splash-palm hh-splash-palm-right">🌴</div>
      <div class="hh-splash-content">
        <div class="hh-splash-kicker">48 HOURS · GOA · BUILD</div>
        <div class="hh-splash-title">HACK <span>HOUSE</span></div>
        <div class="hh-splash-tag">FRAME YOUR BUILDER IDENTITY</div>
        <div class="hh-splash-loader"><i></i><i></i><i></i></div>
      </div>
      <div class="hh-splash-waves"></div>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var splash = document.getElementById('hh-splash');
        if (splash) {
          splash.classList.add('hh-splash-hide');
          window.setTimeout(function () { splash.remove(); }, 420);
        }
      }, 1650);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
